name: lpro2_quiz
description: "تطبيق L Pro العقاري المطور - نسخة بريميوم"
publish_to: 'none'

version: 1.0.1+12<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleDevelopmentRegion</key>
  <string>$(DEVELOPMENT_LANGUAGE)</string>

  <key>CFBundleDisplayName</key>
  <string>LPro</string>

  <key>CFBundleExecutable</key>
  <string>$(EXECUTABLE_NAME)</string>

  <key>CFBundleIdentifier</key>
  <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>

  <key>CFBundleInfoDictionaryVersion</key>
  <string>6.0</string>

  <key>CFBundleName</key>
  <string>LPro</string>

  <key>CFBundlePackageType</key>
  <string>APPL</string>

  <key>CFBundleShortVersionString</key>
  <string>$(FLUTTER_BUILD_NAME)</string>

  <key>CFBundleSignature</key>
  <string>????</string>

  <key>CFBundleVersion</key>
  <string>$(FLUTTER_BUILD_NUMBER)</string>

  <key>LSRequiresIPhoneOS</key>
  <true/>

  <key>UILaunchStoryboardName</key>
  <string>LaunchScreen</string>

  <key>UIMainStoryboardFile</key>
  <string>Main</string>

  <!-- ✅ IMPORTANT: iOS 13+ Scene Manifest (required for proper presentation flows) -->
  <key>UIApplicationSceneManifest</key>
  <dict>
    <key>UIApplicationSupportsMultipleScenes</key>
    <false/>
    <key>UISceneConfigurations</key>
    <dict>
      <key>UIWindowSceneSessionRoleApplication</key>
      <array>
        <dict>
          <key>UISceneConfigurationName</key>
          <string>Default Configuration</string>
          <key>UISceneDelegateClassName</key>
          <string>FlutterSceneDelegate</string>
        </dict>
      </array>
    </dict>
  </dict>

  <key>UISupportedInterfaceOrientations</key>
  <array>
    <string>UIInterfaceOrientationPortrait</string>
    <string>UIInterfaceOrientationLandscapeLeft</string>
    <string>UIInterfaceOrientationLandscapeRight</string>
  </array>

  <key>UISupportedInterfaceOrientations~ipad</key>
  <array>
    <string>UIInterfaceOrientationPortrait</string>
    <string>UIInterfaceOrientationPortraitUpsideDown</string>
    <string>UIInterfaceOrientationLandscapeLeft</string>
    <string>UIInterfaceOrientationLandscapeRight</string>
  </array>

  <!-- Flutter / Rendering -->
  <key>FLTEnableImpeller</key>
  <false/>

  <!-- App Store encryption -->
  <key>ITSAppUsesNonExemptEncryption</key>
  <false/>

  <!-- Firebase -->
  <key>FirebaseAppDelegateProxyEnabled</key>
  <true/>
  <key>FirebaseScreenReportingEnabled</key>
  <false/>

  <!-- Notifications -->
  <key>NSUserNotificationsUsageDescription</key>
  <string>نستخدم الإشعارات لإرسال تحديثات وتنبيهات مهمة داخل تطبيق L Pro.</string>

  <key>UIBackgroundModes</key>
  <array>
    <string>remote-notification</string>
  </array>

  <!-- Misc -->
  <key>CADisableMinimumFrameDurationOnPhone</key>
  <true/>
  <key>UIApplicationSupportsIndirectInputEvents</key>
  <true/>
</dict>
</plist>

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^8.1.6
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  marquee: ^2.2.3
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1

  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.1.0
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.0.0   # ✅ المضافة

  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1
  googleapis_auth: ^2.0.0

  audioplayers: ^6.1.0
  confetti: ^0.7.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  share_plus: ^10.0.0
  intl: ^0.20.2
  http: ^1.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B4D57"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo.svg
    - assets/top_brand.png
    - assets/icon.png
    - assets/sounds/click.mp3
    - assets/sounds/success.mp3
    - assets/sounds/wrong.mp3
    - assets/lottie/