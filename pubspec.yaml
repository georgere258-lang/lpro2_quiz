name: lpro2_quiz
description: "تطبيق L Pro العقاري المطور - نسخة بريميوم"
publish_to: 'none'

version: 1.0.1+52

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- إدارة الحالة ---
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  marquee: ^2.2.3
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1

  # منظومة الفايربيز
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.1.0
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.1.3
  
  # الإشعارات
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1
  googleapis_auth: ^2.0.0

  # الميديا
  audioplayers: ^6.1.0
  confetti: ^0.7.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  share_plus: ^10.0.0
  intl: ^0.20.2
  http: ^1.2.1
  crypto: ^3.0.3
  
  # ✅ مكتبة السبلاش (لإلغاء الشاشة الرمادية وضبط الهوية)
  flutter_native_splash: ^2.3.10
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ✅ 1. إعدادات أيقونة التطبيق (التي تظهر بين التطبيقات) -> icon.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B4D57" # لون الخلفية للأيقونة
  adaptive_icon_foreground: "assets/icon.png"

# ✅ 2. إعدادات شاشة السبلاش (عند فتح التطبيق) -> logo.png + خلفية خضراء
flutter_native_splash:
  color: "#1B4D57"      # ✅ اللون البترولي (بدل الأبيض)
  image: "assets/logo.png"  # ✅ اللوجو الشفاف في المنتصف
  
  # دعم أندرويد 12+ (يضمن نفس الشكل)
  android_12: 
    image: "assets/logo.png"
    color: "#1B4D57"
  
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.svg
    - assets/logo.png       # ✅ ضروري للسبلاش
    - assets/top_brand.png
    - assets/icon.png       # ✅ ضروري للأيقونة
    - assets/sounds/click.mp3
    - assets/sounds/success.mp3
    - assets/sounds/wrong.mp3