# 1. زيادة الذاكرة لتعامل أسرع مع مكتبات Firebase الضخمة
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# 2. تفعيل الـ Daemon لتسريع البناء المتكرر (تحسين جوهري)
org.gradle.daemon=true

# 3. تفعيل البناء المتوازي لتقليل الوقت (يبني أكثر من ملف في نفس الوقت)
org.gradle.parallel=true
org.gradle.caching=true

# 4. إعدادات توافق أندرويد الحديثة
android.useAndroidX=true
android.enableJetifier=true

# 5. تقليل استهلاك الذاكرة لعملية الـ Kotlin (اختياري لكن مفيد)
kotlin.incremental=true